name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck, lint, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Worker bundle check (full Worker, API routes, cron handler; no upload)
        run: npm run check:worker
        env:
          WRANGLER_SEND_METRICS: 'false'

  database:
    name: Migrations, RLS & rating parity
    runs-on: ubuntu-latest
    services:
      postgres:
        # PostGIS is required by the discovery migrations (Supabase ships it as an extension).
        image: postgis/postgis:17-3.5
        env: { POSTGRES_PASSWORD: postgres }
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run test:db
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres

  e2e:
    name: E2E, accessibility & PWA (iPhone viewport)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
