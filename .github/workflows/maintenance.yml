name: Data maintenance

# Manual data-maintenance tasks for the discovery pipeline. "diagnose" is read-only.
on:
  workflow_dispatch:
    inputs:
      task:
        description: 'diagnose (read-only) | robots (read-only) | reclassify (dry run) | reclassify --apply'
        default: diagnose

jobs:
  run:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    env:
      SITE_URL: ${{ vars.SITE_URL || 'https://aour.mute-frost-03a9.workers.dev' }}
      SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      OVERTURE_RELEASE: ${{ vars.OVERTURE_RELEASE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Run task
        env:
          TASK: ${{ github.event.inputs.task || 'diagnose' }}
        run: |
          case "$TASK" in
            "diagnose") npx tsx scripts/maintenance.ts diagnose ;;
            "robots") npx tsx scripts/maintenance.ts robots ;;
            "reclassify") npx tsx scripts/maintenance.ts reclassify ;;
            "reclassify --apply") npx tsx scripts/maintenance.ts reclassify --apply ;;
            *) echo "Unknown task: $TASK"; exit 2 ;;
          esac
